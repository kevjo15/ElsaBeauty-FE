name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - codex/connect-frontend-to-backend-development-x23gfi
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - codex/connect-frontend-to-backend-development-x23gfi

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_GLACIER_0308C0803 }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          production_branch: "codex/connect-frontend-to-backend-development-x23gfi"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"

