name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - codex/connect-frontend-to-backend-development-x23gfi

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_MEADOW_0AEB5A01E }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
